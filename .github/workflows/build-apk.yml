name: Build FitLife APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: fitlife-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.7"
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FITLIFE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitlife-release.jks"
            echo "FITLIFE_RELEASE_STORE=$RUNNER_TEMP/fitlife-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: flutter build apk --release --no-pub
        env:
          FITLIFE_KEYSTORE_PATH: ${{ env.FITLIFE_RELEASE_STORE }}
          FITLIFE_STORE_PASSWORD: ${{ secrets.FITLIFE_STORE_PASSWORD }}
          FITLIFE_KEY_PASSWORD: ${{ secrets.FITLIFE_KEY_PASSWORD }}
          FITLIFE_KEY_ALIAS: ${{ secrets.FITLIFE_KEY_ALIAS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

# FitLife 2.0: source code is built as committed; CI must not rewrite app.dart.
