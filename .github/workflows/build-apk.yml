name: Build FitLife APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.7"
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --no-pub .

      - name: Remove generated template tests
        run: rm -f test/widget_test.dart

      - name: Apply FitLife Modern Green design
        run: python3 tool/apply_design.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-APK
          path: build/app/outputs/flutter-apk/app-release.apk
