name = "fitlife-photo"
main = "src/entry.mjs"
compatibility_date = "2026-10-20"
workers_dev = true

[observability]
enabled = false

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
USER_DAILY_LIMIT = "10"
GLOBAL_DAILY_LIMIT = "100"
GLOBAL_MINUTE_LIMIT = "5"

[[d1_databases]]
binding = "DB"
database_name = "fitlife-photo"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]
