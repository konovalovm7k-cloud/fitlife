name: fitlife
description: FitLife weight loss tracker
publish_to: "none"
version: 4.6.17+31

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3
  image_picker: ^1.2.3
  http: ^1.5.0
  image: ^4.5.4
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/food_catalog.json
    - shared/chef_catalogue.json
    - assets/fonts/OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
